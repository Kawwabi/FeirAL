<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Flores e plantas">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.5" fill="rgba(255,255,255,0.16)"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#g)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>
  <g fill="rgba(255,255,255,0.9)">
    <circle cx="150" cy="470" r="60"/>
    <circle cx="1050" cy="140" r="80"/>
  </g>
  <text x="600" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="700" fill="#ffffff">Flores e plantas</text>
  <text x="600" y="380" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.85)">FeirAL - feirinhas de Alagoas</text>
</svg>
